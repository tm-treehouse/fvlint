name: ci
on: [push, pull_request]

jobs:
  # Unit tests of the internals: no Yosys, SymbiYosys or solver needed.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install ruff reuse coverage
      - run: ruff check src tests --select E,F,W --ignore E731 --line-length 120
      - run: reuse lint
      - run: python -m coverage run --branch --source=src/fvlint -m unittest discover -s tests/unit -t . -v
      - run: python -m coverage report --fail-under=95

  # Pip-only toolchain: YoWASP Yosys + SymbiYosys, Z3, and yosys-abc from pyosys.
  regress-pip:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      # Pinned to the Yosys release fvlint is tested with (netlist.TESTED_YOSYS)
      # and that made the unit tests' committed netlist snapshots.
      - run: pip install .[yowasp] "yowasp-yosys==0.71.*" "pyosys==0.71.*"
      - run: python tests/unit/data/make_snapshots.py --check
      - run: python -m fvlint.regress tests/regress/manifest.toml -j 2 --budget-scale 2 --fuzz 20 --junit regress.xml -o regress_out
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: regress-pip, path: "regress.xml\nregress_out/summary.json"}

  # Native toolchain (OSS CAD Suite): faster, and the configuration most users run.
  regress-oss-cad-suite:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      # Pinned to the build of 2026-11-14: Yosys 0.71+34, a development build
      # from just after the 0.71 release (2026-11-12), which fvlint is tested
      # with (its netlists differ slightly from the 0.71 release, so the snapshot
      # check below only warns).  Move it together with TESTED_YOSYS and the
      # default in action.yml.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-11-14"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install .
      # A newer Yosys may elaborate the snapshot sources differently: report it.
      - run: python tests/unit/data/make_snapshots.py --check || echo "::warning::unit-test netlist snapshots differ under this Yosys"
      - run: python -m fvlint.regress tests/regress/manifest.toml -j 2 --fuzz 20 --junit regress.xml -o regress_out
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: regress-oss-cad-suite, path: "regress.xml\nregress_out/summary.json"}

  # The GitHub Action of this repository (action.yml), run from the checkout
  # on a small project file: one configuration is clean, one has a known FAIL.
  action:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        id: all
        continue-on-error: true            # the action exits with fvlint's status: 1 (findings) here
        with:
          config: tests/regress/action_smoke.toml
          output: action_out
          artifact-name: action-smoke
      - uses: ./
        id: clean
        with:
          config: tests/regress/action_smoke.toml
          configs: clean
          output: action_out_clean
          upload: "false"
      - name: Check the action's outputs and results
        env:
          RC_ALL: ${{ steps.all.outputs.exit-code }}
          OUTCOME_ALL: ${{ steps.all.outcome }}
          RC_CLEAN: ${{ steps.clean.outputs.exit-code }}
        run: |
          set -eu
          [ "$RC_ALL" = 1 ] || { echo "::error::exit-code with a FAIL: '$RC_ALL', expected 1"; exit 1; }
          [ "$OUTCOME_ALL" = failure ] || { echo "::error::the step with a FAIL ended '$OUTCOME_ALL'"; exit 1; }
          [ "$RC_CLEAN" = 0 ] || { echo "::error::exit-code of the clean run: '$RC_CLEAN', expected 0"; exit 1; }
          python3 - <<'PY'
          import json
          def statuses(path):
              with open(path) as f:
                  return {r["id"]: r["status"] for r in json.load(f)["results"]}
          assert statuses("action_out/clean/results.json") == {"counter_overflow:q": "PROVEN"}
          assert statuses("action_out/bug/results.json") == {"counter_overflow:q": "FAIL"}
          assert statuses("action_out_clean/clean/results.json") == {"counter_overflow:q": "PROVEN"}
          PY
          [ ! -e action_out_clean/bug ] || { echo "::error::configs: clean also ran bug"; exit 1; }
