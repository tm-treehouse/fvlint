#
# Run fvlint in GitHub Actions: installs the OSS CAD Suite and this version
# of fvlint, runs a project file's configurations with findings annotated on
# their source lines and a summary in the job summary, and uploads the
# results (with counterexample traces).  Usage:
#
#   - uses: actions/checkout@v7
#   - uses: tm-treehouse/fvlint@v0.7.0
#     with:
#       config: fvlint.toml          # default
#       configs: default irq         # default: every configuration in the file
#       fail-on-findings: false      # report only (default: findings fail the step)
name: fvlint
description: Formal lint for RTL with fvlint (counters, case statements, part-selects, memories, FSMs)
branding:
  icon: check-circle
  color: blue

inputs:
  config:
    description: Project file (TOML) with the configurations to run.
    default: fvlint.toml
  configs:
    description: Names of the configurations to run, separated by spaces (default every one).
    default: ""
  args:
    description: More fvlint options for every configuration, e.g. "--fail-on unknown -j 4".
    default: ""
  annotations:
    description: >-
      Annotate findings on their source lines ("true" or "false").  The job
      summary is written either way.
    default: "true"
  fail-on-findings:
    description: >-
      Fail the step when fvlint has findings (exit status 1), "true" or
      "false".  With "false" the step only reports them (see the exit-code
      output); it still fails when fvlint can't run (exit status 2).
    default: "true"
  output:
    description: Output directory; each configuration writes to OUTPUT/NAME.
    default: fvlint_out
  upload:
    description: Upload the output directory as an artifact ("true" or "false").
    default: "true"
  artifact-name:
    description: Artifact name (default fvlint, or fvlint-NAME... for the configurations given).
    default: ""
  python-version:
    description: Python version for fvlint (3.11 or later).
    default: "3.12"
  oss-cad-suite-version:
    description: >-
      OSS CAD Suite build (a date).  The default is the build fvlint's own CI
      runs with: 2026-11-14, Yosys 0.71+34 (a development build just after the
      0.71 release).
    default: "2026-11-14"
  github-token:
    description: Token for downloading the OSS CAD Suite (avoids API rate limits).
    default: ${{ github.token }}

outputs:
  exit-code:
    description: fvlint's exit status (0 clean, 1 findings, 2 could not run).
    value: ${{ steps.run.outputs.rc }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    # The action can run several times in a job; setup-oss-cad-suite can't
    # (its download is in the way), and the tools from the first run are
    # still on PATH.
    - name: OSS CAD Suite already installed?
      id: ocs
      shell: bash
      env:
        WANT: ${{ inputs.oss-cad-suite-version }}
      run: |
        have="${FVLINT_OSS_CAD_SUITE:-}"
        if [ -z "$have" ]; then
          echo "install=true" >> "$GITHUB_OUTPUT"
        elif [ "$have" != "$WANT" ]; then
          echo "::error title=fvlint::OSS CAD Suite $have is installed in this job by an earlier fvlint step; this step asks for $WANT (use one version per job)"
          exit 2
        fi
    - uses: YosysHQ/setup-oss-cad-suite@v4
      if: steps.ocs.outputs.install == 'true'
      with:
        version: ${{ inputs.oss-cad-suite-version }}
        github-token: ${{ inputs.github-token }}
    - name: Remember the OSS CAD Suite version
      if: steps.ocs.outputs.install == 'true'
      shell: bash
      env:
        WANT: ${{ inputs.oss-cad-suite-version }}
      run: echo "FVLINT_OSS_CAD_SUITE=$WANT" >> "$GITHUB_ENV"
    - name: Install fvlint
      shell: bash
      env:
        FVLINT_SRC: ${{ github.action_path }}
      run: python -m pip install --quiet "$FVLINT_SRC"
    - name: Run fvlint
      id: run
      shell: bash
      env:
        FVLINT_CONFIG: ${{ inputs.config }}
        FVLINT_CONFIGS: ${{ inputs.configs }}
        FVLINT_ARGS: ${{ inputs.args }}
        FVLINT_OUT: ${{ inputs.output }}
        FVLINT_ARTIFACT: ${{ inputs.artifact-name }}
        FVLINT_ANNOTATIONS: ${{ inputs.annotations }}
        FVLINT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        for v in "$FVLINT_ANNOTATIONS" "$FVLINT_FAIL_ON_FINDINGS"; do
          case $v in
            true|false) ;;
            *) echo "::error title=fvlint::annotations and fail-on-findings take \"true\" or \"false\", not '$v'"
               echo "rc=2" >> "$GITHUB_OUTPUT"; exit 2 ;;
          esac
        done
        read -r -a names <<< "$FVLINT_CONFIGS"
        read -r -a extra <<< "$FVLINT_ARGS"
        if [ "$FVLINT_ANNOTATIONS" = true ]; then
          report=(--github)
        else
          report=(--summary-md "$GITHUB_STEP_SUMMARY")
        fi
        set +e
        fvlint --config "$FVLINT_CONFIG" "${names[@]}" -o "$FVLINT_OUT" "${report[@]}" "${extra[@]}"
        rc=$?
        set -e
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        artifact="$FVLINT_ARTIFACT"
        if [ -z "$artifact" ]; then
          artifact="fvlint"
          for n in "${names[@]}"; do artifact="$artifact-$n"; done
        fi
        echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v7
      if: always() && inputs.upload == 'true'
      with:
        name: ${{ steps.run.outputs.artifact }}
        path: ${{ inputs.output }}
    - name: Exit status
      shell: bash
      env:
        RC: ${{ steps.run.outputs.rc }}
        FVLINT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        rc="${RC:-2}"
        if [ "$rc" = 1 ] && [ "$FVLINT_FAIL_ON_FINDINGS" = false ]; then
          echo "fvlint found findings (exit status 1); fail-on-findings is false, so the step passes"
          rc=0
        fi
        exit "$rc"
