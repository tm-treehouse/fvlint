#
# Run fvlint in GitHub Actions: installs the OSS CAD Suite and this version
# of fvlint, runs a project file's configurations with findings annotated on
# their source lines and a summary in the job summary, and uploads the
# results (with counterexample traces).  Usage:
#
#   - uses: actions/checkout@v7
#   - uses: tm-treehouse/fvlint@v0.4.0
#     with:
#       config: fvlint.toml          # default
#       configs: default irq         # default: every configuration in the file
name: fvlint
description: Formal lint for RTL with fvlint (counters, case statements, part-selects, memories, FSMs)
branding:
  icon: check-circle
  color: blue

inputs:
  config:
    description: Project file (TOML) with the configurations to run.
    default: fvlint.toml
  configs:
    description: Names of the configurations to run, separated by spaces (default every one).
    default: ""
  args:
    description: More fvlint options for every configuration, e.g. "--fail-on unknown -j 4".
    default: ""
  output:
    description: Output directory; each configuration writes to OUTPUT/NAME.
    default: fvlint_out
  upload:
    description: Upload the output directory as an artifact ("true" or "false").
    default: "true"
  artifact-name:
    description: Artifact name (default fvlint, or fvlint-NAME... for the configurations given).
    default: ""
  python-version:
    description: Python version for fvlint (3.11 or later).
    default: "3.12"
  oss-cad-suite-version:
    description: >-
      OSS CAD Suite build (a date).  The default is the build fvlint's own CI
      runs with: 2026-11-14, Yosys 0.71+34 (a development build just after the
      0.71 release).
    default: "2026-11-14"
  github-token:
    description: Token for downloading the OSS CAD Suite (avoids API rate limits).
    default: ${{ github.token }}

outputs:
  exit-code:
    description: fvlint's exit status (0 clean, 1 findings, 2 could not run).
    value: ${{ steps.run.outputs.rc }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - uses: YosysHQ/setup-oss-cad-suite@v4
      with:
        version: ${{ inputs.oss-cad-suite-version }}
        github-token: ${{ inputs.github-token }}
    - name: Install fvlint
      shell: bash
      env:
        FVLINT_SRC: ${{ github.action_path }}
      run: python -m pip install --quiet "$FVLINT_SRC"
    - name: Run fvlint
      id: run
      shell: bash
      env:
        FVLINT_CONFIG: ${{ inputs.config }}
        FVLINT_CONFIGS: ${{ inputs.configs }}
        FVLINT_ARGS: ${{ inputs.args }}
        FVLINT_OUT: ${{ inputs.output }}
        FVLINT_ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        read -r -a names <<< "$FVLINT_CONFIGS"
        read -r -a extra <<< "$FVLINT_ARGS"
        set +e
        fvlint --config "$FVLINT_CONFIG" "${names[@]}" -o "$FVLINT_OUT" --github "${extra[@]}"
        rc=$?
        set -e
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        artifact="$FVLINT_ARTIFACT"
        if [ -z "$artifact" ]; then
          artifact="fvlint"
          for n in "${names[@]}"; do artifact="$artifact-$n"; done
        fi
        echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v7
      if: always() && inputs.upload == 'true'
      with:
        name: ${{ steps.run.outputs.artifact }}
        path: ${{ inputs.output }}
    - name: Exit status
      shell: bash
      env:
        RC: ${{ steps.run.outputs.rc }}
      run: exit "${RC:-2}"
