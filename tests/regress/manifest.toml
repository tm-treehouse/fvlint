[[case]]
name = "branches/fsm_state"
files = ["../fixtures/branches.sv"]
top = "br_fsm"
args = ["--dead-branches"]
# The branches in the unreachable ERR state are INFO: fsm_unreachable is the finding.
expect = { "fsm_unreachable:st=2'b11" = "FAIL", "fsm_summary:st" = "INFO", "dead_branch:st==2'd3" = "INFO", "dead_branch:d" = "INFO", "dead_branch:!d" = "INFO", "dead_branch:st!=2'd3" = "PROVEN", "dead_branch:st==2'd0" = "PROVEN", "dead_branch:st==2'd1" = "PROVEN", "dead_branch:go" = "PROVEN", "dead_branch:!go" = "PROVEN" }
strict = true
tags = ["branches", "fsm"]

