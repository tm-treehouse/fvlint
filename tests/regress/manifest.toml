# ---------------------------------------------------------------- memory
[[case]]
name = "memory/ring_ok"
files = ["../fixtures/memory.sv"]
top = "ring_ok"
# The addresses stay in range, but nothing guards writes or reads: a FIFO
# that overflows and underflows.  Its pointers wrap explicitly at 99, so
# their counter checks stay (and prove the wrap works).
expect = { "mem_addr:mem.rd0" = "PROVEN", "mem_addr:mem.wr0" = "PROVEN", "counter_overflow:wp" = "PROVEN", "counter_overflow:rp" = "PROVEN", "fifo_overflow:mem" = "FAIL", "fifo_underflow:mem" = "FAIL" }
strict = true
tags = ["memory", "fifo"]

[[case]]
name = "memory/ring_bug"
files = ["../fixtures/memory.sv"]
top = "ring_bug"
engines = ["pdr", "smtbmc"]
expect = { "mem_addr:mem.wr0" = "FAIL", "mem_addr:mem.rd0" = "FAIL", "counter_overflow:wp" = "PROVEN" }
budget_s = 150
tags = ["memory", "bug"]

[[case]]
name = "memory/ring_bug_assume"
files = ["../fixtures/memory.sv"]
top = "ring_bug"
args = ["--assume", "{dir}/../fixtures/ring_bug_assume.sv"]
expect = { "mem_addr:mem.rd0" = "PROVEN", "mem_addr:mem.wr0" = "FAIL", "counter_overflow:wp" = "PROVEN" }
tags = ["memory", "assume"]

# ------------------------------------------------------ vacuity / environment
[[case]]
name = "vacuity/assume_vacuous"
files = ["../fixtures/memory.sv"]
top = "ring_bug"
args = ["--assume", "{dir}/../fixtures/assume_vacuous.sv"]
expect = { "mem_addr:mem.wr0" = "VACUOUS", "counter_overflow:wp" = "VACUOUS", "mem_addr:mem.rd0" = "FAIL" }
expect_detail = { "mem_addr:mem.wr0" = "can never hold" }
tags = ["vacuity", "review"]

[[case]]
name = "vacuity/assume_unsat"
