#
# fvlint regression manifest.  Run with:
#   python -m fvlint.regress tests/regress/manifest.toml -j 4
# Every case states the expected status of each check; anything unexpected
# that is FAIL / ERROR / VACUOUS also fails the case.  Cases listing
# engines = ["pdr", "smtbmc"] run once per proof engine.

[defaults]
budget_s = 90
engines = ["auto"]

# ------------------------------------------------------------- counters
[[case]]
name = "counters/cnt_mod100"
files = ["../fixtures/counters.sv"]
top = "cnt_mod100"
engines = ["pdr", "smtbmc"]
expect = { "counter_overflow:q" = "PROVEN" }
tags = ["counter"]

[[case]]
name = "counters/cnt_badlimit"
files = ["../fixtures/counters.sv"]
top = "cnt_badlimit"
engines = ["pdr", "smtbmc"]
expect = { "counter_overflow:q" = "FAIL" }
tags = ["counter", "bug"]

[[case]]
name = "counters/credit_ok"
files = ["../fixtures/counters.sv"]
top = "credit_ok"
engines = ["pdr", "smtbmc"]
expect = { "counter_overflow:used" = "PROVEN", "counter_underflow:used" = "PROVEN" }
tags = ["counter", "cone"]

[[case]]
name = "counters/credit_bug"
files = ["../fixtures/counters.sv"]
top = "credit_bug"
engines = ["pdr", "smtbmc"]
expect = { "counter_overflow:used" = "FAIL", "counter_underflow:used" = "PROVEN" }
tags = ["counter", "bug", "cone"]

[[case]]
name = "counters/timebase"
files = ["../fixtures/counters.sv"]
top = "timebase"
expect = { "counter_overflow:div" = "INFO" }
strict = true
tags = ["counter"]

[[case]]
name = "counters/cnt_wide"
files = ["../fixtures/counters.sv"]
top = "cnt_wide"
engines = ["pdr", "smtbmc"]
