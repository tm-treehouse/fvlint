# ------------------------------------------------------------------ FIFOs
# FIFO proofs relate the checker's count to the design's own bookkeeping:
# PDR finds that, k-induction alone doesn't (see the README's limitations).
[[case]]
name = "fifo/count"
files = ["../fixtures/fifos.sv"]
top = "fifo_count"
engines = ["pdr"]
expect = { "fifo_overflow:mem" = "PROVEN", "fifo_underflow:mem" = "PROVEN", "counter_overflow:wp" = "INFO", "counter_overflow:rp" = "INFO" }
strict = true
exit = 0
tags = ["fifo"]

[[case]]
name = "fifo/pointers"
files = ["../fixtures/fifos.sv"]
top = "fifo_ptrs"
engines = ["pdr"]
# The 4-bit pointers wrap by overflowing: INFO, not the FAIL they used to be.
expect = { "fifo_overflow:mem" = "PROVEN", "fifo_underflow:mem" = "PROVEN", "counter_overflow:wp" = "INFO", "counter_overflow:rp" = "INFO" }
strict = true
exit = 0
tags = ["fifo"]

[[case]]
name = "fifo/no_full_check"
files = ["../fixtures/fifos.sv"]
top = "fifo_nofull"
engines = ["pdr", "smtbmc"]
expect = { "fifo_overflow:mem" = "FAIL" }
tags = ["fifo", "bug"]

[[case]]
name = "fifo/full_off_by_one"
files = ["../fixtures/fifos.sv"]
top = "fifo_offbyone"
expect = { "fifo_overflow:mem" = "FAIL", "fifo_underflow:mem" = "PROVEN" }
tags = ["fifo", "bug"]

[[case]]
name = "fifo/three_entries"
files = ["../fixtures/fifos.sv"]
top = "fifo_three"
engines = ["pdr"]
expect = { "fifo_overflow:mem" = "PROVEN", "fifo_underflow:mem" = "PROVEN", "counter_overflow:wp" = "PROVEN", "counter_overflow:rp" = "PROVEN" }
exit = 0
tags = ["fifo"]

[[case]]
name = "fifo/flush"
files = ["../fixtures/fifos.sv"]
top = "fifo_flush"
args = ["--checks", "fifo_overflow,fifo_underflow"]
# Pointers loaded in mid-run: not a FIFO these checks can count.
expect = {}
strict = true
exit = 0
tags = ["fifo"]
